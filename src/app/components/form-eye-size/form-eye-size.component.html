<mat-card class="optix-card">
  <mat-card-header>
    <div class="card-title-container">
      <h2 class="mat-h2" style="margin: 0;">{{ nomFormulaire() }}</h2>
      <div class="demo-buttons">
        <button mat-stroked-button color="primary" type="button" (click)="fillTest1()">Demo 1</button>
        <button mat-stroked-button color="tertiary" type="button" (click)="fillTest2()">Demo 2</button>
      </div>
    </div>
  </mat-card-header>

  <mat-card-content>
    <form class="form-grid">
      <!-- Sphere -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Sphere</mat-label>
        <input matInput type="number" step="0.25" placeholder="0.00" [formField]="eyeForm.sphere">
      </mat-form-field>

      <!-- Cylindre -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Cylindre</mat-label>
        <input matInput type="number" step="0.25" placeholder="0.00" [formField]="eyeForm.cylindre">
      </mat-form-field>

      <!-- Axe -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Axe</mat-label>
        <input matInput type="number" placeholder="0" [formField]="eyeForm.axe">
      </mat-form-field>

      <!-- DVO -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>DVO</mat-label>
        <input matInput type="number" step="0.5" placeholder="0" [formField]="eyeForm.dvo">
      </mat-form-field>

      <!-- DHIV -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>DHIV</mat-label>
        <input matInput type="number" placeholder="0" [formField]="eyeForm.dhiv">
      </mat-form-field>

      <!-- K1 -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>K1</mat-label>
        <input matInput type="number" step="0.01" placeholder="0.00" [formField]="eyeForm.k1">
      </mat-form-field>

      <!-- X (Axe match) -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>K1 Axe</mat-label>
        <input matInput type="number" placeholder="0" [formField]="eyeForm.x">
      </mat-form-field>

      <!-- K2 -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>K2</mat-label>
        <input matInput type="number" step="0.01" placeholder="0.00" [formField]="eyeForm.k2">
      </mat-form-field>

      <!-- Y (Axe match) -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>K2 Axe</mat-label>
        <input matInput type="number" placeholder="0" [formField]="eyeForm.y">
      </mat-form-field>

      <!-- Excentricité -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Excentricité</mat-label>
        <input matInput type="number" step="0.05" placeholder="0.00" [formField]="eyeForm.excentricite">
      </mat-form-field>
    </form>
  </mat-card-content>
</mat-card>
