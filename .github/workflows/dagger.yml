name: Dagger CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Run Validation (Lint, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 Run Dagger Pipeline
        uses: dagger/dagger-for-github@v7
        with:
          verb: call
          args: run-all --source=.

